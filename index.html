<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Measurement of Jet Forces - Interactive 3D Fluid Mechanics Vocational Training Simulator. Study the reaction forces exerted by water jets on flat, conical, and hemispherical deflectors." />
    <title>Measurement of Jet Forces | 3D Laboratory Simulator</title>
    <!-- Preload Cairo and Inter Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      /*
        Boot shell (BEDO-UX-04).

        The React overlay cannot paint until a 1.35 MB bundle has downloaded and executed —
        measured at ~800-1500 ms on production, during which the user saw an empty dark
        page. This is the same lockup rendered from static HTML so that something branded
        is on screen at first paint instead. React clears #root on its first render and
        takes over seamlessly.

        Deliberately wordless: the language preference is not known until the bundle runs,
        and showing English here would reintroduce the EN->AR flash BEDO-UX-02 removed.
      */
      #boot { position: fixed; inset: 0; display: flex; align-items: center;
              justify-content: center; background: #141517; }
      #boot .mark { font: 700 34px/1 'Inter', system-ui, sans-serif; letter-spacing: .34em;
                    color: #f58220; text-indent: .34em; }
      #boot .bar { width: 260px; height: 4px; margin-top: 26px; border-radius: 3px;
                   background: rgba(255,255,255,.08); overflow: hidden; }
      #boot .bar i { display: block; width: 38%; height: 100%; border-radius: 3px;
                     background: linear-gradient(90deg, #f58220, #ff9100);
                     animation: bootslide 1.15s ease-in-out infinite; }
      @keyframes bootslide { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div style="display:flex;flex-direction:column;align-items:center">
          <div class="mark">BEDO</div>
          <div class="bar"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
