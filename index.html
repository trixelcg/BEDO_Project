<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon set, generated from assets-source/brand/FAV_Icon.png by
      scripts/brand/build-icons.py. `sizes="any"` marks the .ico as the multi-resolution
      fallback (16/32/48) so it does not compete with the two exact-size PNGs below;
      browsers that understand `sizes` pick the PNG that matches their slot, and the rest
      fall back to the .ico. These are stable-name assets — see the note in
      scripts/release/asset-manifest.mjs on why the favicon is not content-addressed.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Measurement of Jet Forces - Interactive 3D Fluid Mechanics Vocational Training Simulator. Study the reaction forces exerted by water jets on flat, conical, and hemispherical deflectors." />
    <title>Measurement of Jet Forces | 3D Laboratory Simulator</title>
    <!-- Preload Cairo and Inter Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      /*
        Boot shell (BEDO-UX-04).

        The React overlay cannot paint until a 1.35 MB bundle has downloaded and executed —
        measured at ~800-1500 ms on production, during which the user saw an empty dark
        page. This is the same lockup rendered from static HTML so that something branded
        is on screen at first paint instead. React clears #root on its first render and
        takes over seamlessly.

        Deliberately wordless: the language preference is not known until the bundle runs,
        and showing English here would reintroduce the EN->AR flash BEDO-UX-02 removed.
        The logo is the brand mark, not copy, so it is language-neutral and stays.

        The sizing here is duplicated in `.loading-mark` (src/index.css) on purpose: React
        swaps this frame for its own and the two marks must land on the same pixels, or the
        handover reads as a jump.
      */
      #boot { position: fixed; inset: 0; display: flex; align-items: center;
              justify-content: center; background: #141517; }
      /* Square by declaration as well as by attribute, so the row is reserved at its final
         height before the PNG arrives and the bar below it never shifts. */
      #boot .mark { display: block; width: clamp(84px, 18vmin, 128px); height: auto;
                    aspect-ratio: 1 / 1; }
      #boot .bar { width: 260px; height: 4px; margin-top: 26px; border-radius: 3px;
                   background: rgba(255,255,255,.08); overflow: hidden; }
      #boot .bar i { display: block; width: 38%; height: 100%; border-radius: 3px;
                     background: linear-gradient(90deg, #f58220, #ff9100);
                     animation: bootslide 1.15s ease-in-out infinite; }
      @keyframes bootslide { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div style="display:flex;flex-direction:column;align-items:center">
          <img class="mark" src="/bedo-logo-dark.png" alt="BEDO" width="447" height="447"
               fetchpriority="high" decoding="async" />
          <div class="bar"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
