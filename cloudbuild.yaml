# GCP Cloud Build Configuration for BEDO Project R3F
#
# ## Usage
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD),_SERVICE_NAME=bedo-project-r3f-app
#
# `_TAG` and `_SERVICE_NAME` have **no defaults on purpose**. Cloud Build refuses to create
# a build whose config references a substitution that was neither defined here nor passed
# on the command line, so a build that does not say *what* it is shipping and *where* fails
# before a single step runs. That is the safe direction, and it is not hypothetical: the
# defaults used to be `latest` and `bedo-project-r3f-app`, which meant a bare
# `gcloud builds submit` rebuilt a mutable tag and released it straight to production.
#
# Fail closed. Say both, every time.
#
# ## Why the deploy uses a digest and not the tag
#
# A tag is a moving pointer; a digest is the image. Production ran for five weeks on an
# image whose tag said `latest` and whose contents were 37 days stale, and nothing in the
# deployment recorded which commit it came from. Step 3 resolves the digest that step 2
# actually pushed and step 4 deploys *that*, so the revision Cloud Run creates names the
# exact bytes it is serving and can be traced back without trusting a tag anyone can move.
#
# The tag is still pushed, for humans reading the registry. Nothing deploys from it.
#
# ## The deploy takes NO traffic
#
# `gcloud run deploy` sends 100% of traffic to the new revision by default. That is how a
# pipeline turns a build into an outage with no separate decision in between, and it is the
# wrong default for a service that has now torn page loads twice under traffic splitting.
#
# The revision is created with `--no-traffic` and a tag, so it is reachable at its own tag
# URL for smoke tests while production keeps serving whatever it was serving. Shifting
# traffic is a deliberate, separate act.
#
# ## Public access is NOT granted here
#
# This pipeline deploys the service and its revision. It does not touch IAM.
#
# `--allow-unauthenticated` used to be on the deploy step and was doing nothing: the Cloud
# Build service account does not hold `run.services.setIamPolicy`, so the flag was accepted
# and silently ignored. A service created by this config came up **private** while the
# build log implied otherwise — which is exactly how a deploy looks healthy and returns 403
# to every visitor.
#
# So a NEW service will be private until somebody grants access explicitly:
#
#   gcloud run services add-iam-policy-binding <SERVICE> \
#     --region us-central1 \
#     --project neon-radius-644 \
#     --member=allUsers \
#     --role=roles/run.invoker
#
# Existing services keep whatever IAM they already have — deploying a revision does not
# alter a service's IAM policy, so re-deploying production does not change its public
# binding one way or the other.

steps:
  # 1. Build the container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '--build-arg'
      # The release generation identity. `_TAG` is the commit the release is cut from, so a
      # running page can report exactly which source produced it — during a rollout two
      # builds serve at once and the URL alone does not say which one answered.
      - 'BUILD_GEN=$_TAG'
      - '-t'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/bedo-project-r3f:$_TAG'
      - '.'

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/bedo-project-r3f:$_TAG'

  # 3. Resolve what was actually pushed, by digest.
  #
  # `RepoDigests` is filled in by the push in step 2, so this is the registry's own answer
  # rather than anything recomputed here.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'resolve-digest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/bedo-project-r3f"
        docker image inspect "$${IMAGE}:$_TAG" \
          --format '{{index .RepoDigests 0}}' > /workspace/image-digest.txt
        echo "deploying by digest: $$(cat /workspace/image-digest.txt)"

  # 3b. Publish this build's static assets to the shared, revision-independent origin.
  #
  # `dist/` is extracted from the image that was just pushed rather than rebuilt here, so
  # the bytes published are provably the same bytes the revision serves.
  #
  # This must happen BEFORE the deploy. Cloud Run routes every request independently, so
  # the moment a revision can receive traffic its assets must already be reachable from the
  # shared origin — otherwise a split tears page loads (PERF-05, PERF-05B).
  - name: 'gcr.io/cloud-builders/docker'
    id: 'extract-dist'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/bedo-project-r3f:$_TAG"
        CID=$$(docker create "$${IMAGE}")
        rm -rf /workspace/dist
        docker cp "$${CID}:/app/dist" /workspace/dist
        docker rm "$${CID}" > /dev/null
        echo "extracted $$(find /workspace/dist -type f | wc -l) files from the image"

  # Runs on `node:20`, not on cloud-sdk. No stock builder image has both node and gcloud
  # (checked: cloud-sdk has no node, node:20 has no gcloud), and `apt-get install nodejs`
  # would make every release depend on a package repo being up. The release scripts talk to
  # GCS over its REST API using a token from Cloud Build's metadata server, so this step
  # needs no installs and no `npm ci`.
  - name: 'node:20'
    id: 'publish-assets'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        node scripts/release/publish-assets.mjs --bucket "$_ASSET_BUCKET"

  # 3c. Asset-closure gate. Fails the build if anything the HTML or the manifest references
  # is absent from the shared origin, or is published with a content type a browser will
  # refuse (a module served as octet-stream loads 200 and then does not execute).
  - name: 'node:20'
    id: 'verify-asset-closure'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        node scripts/release/verify-asset-closure.mjs --bucket "$_ASSET_BUCKET"

  # 4. Deploy that digest to Cloud Run.
  #
  # Service and revision only. IAM is deliberately not touched here — see the header.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        # Cloud Run traffic tags must begin with a LETTER and contain only lowercase
        # letters, digits and '-'. `_TAG` is the commit sha, which begins with a digit
        # about 62% of the time, so passing it straight through failed the deploy for most
        # commits (`spec.traffic.tag: Resource name must use only lowercase letters...`).
        # The `rev-` prefix guarantees a valid first character; the rest is sanitised so an
        # unusual `_TAG` cannot fail the release at the very last step.
        TAG_SAFE="rev-$$(printf '%s' "$_TAG" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/-*$$//')"
        echo "traffic tag: $${TAG_SAFE}"

        gcloud run deploy "$_SERVICE_NAME" \
          --image "$$(cat /workspace/image-digest.txt)" \
          --region "$_RUN_REGION" \
          --platform managed \
          --no-traffic \
          --tag "$${TAG_SAFE}" \
          --set-env-vars "GCS_BUCKET_NAME=$_ASSET_BUCKET,NODE_ENV=production"

        # `gcloud run deploy` returns once the revision is serving, but state the invariant
        # out loud anyway: this pipeline must never move traffic. If it ever does, the build
        # log is where that will be visible.
        echo "--- traffic after deploy (must be unchanged by this pipeline) ---"
        gcloud run services describe "$_SERVICE_NAME" --region "$_RUN_REGION" \
          --format='value(status.traffic)'

images:
  - '$_AR_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/bedo-project-r3f:$_TAG'

# Only the values that are the same for every deployment have defaults. `_TAG` and
# `_SERVICE_NAME` are deliberately absent; see the header.
substitutions:
  _AR_REGION: 'us-central1'
  _ASSET_BUCKET: 'bedo-project-assets-2026'
  _AR_REPO: 'bedo-project-r3f-repo'
  _RUN_REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
